const Fin = {
  acc(id){ return S.fin.accounts.find(a=>a.id===id); },
  balance(a){ return (+a.initial||0) + S.fin.tx.reduce((s,t)=>{
    if(t.type==="income"&&t.accountId===a.id) return s+t.amount;
    if(t.type==="expense"&&t.accountId===a.id) return s-t.amount;
    if(t.type==="transfer"){ if(t.accountId===a.id) s-=t.amount; if(t.toAccountId===a.id) s+=t.amount; }
    return s; },0); },
  month(m){ return S.fin.tx.filter(t=>t.date.slice(0,7)===m); },
  total(list,type){ return list.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0); },
  byCat(m){ const o={}; Fin.month(m).filter(t=>t.type==="expense").forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amount); return Object.entries(o).sort((a,b)=>b[1]-a[1]); },
  budget(cat){ return S.fin.budgets.find(b=>b.cat===cat); },
  used(cat,m){ return Fin.month(m).filter(t=>t.type==="expense"&&t.cat===cat).reduce((s,t)=>s+t.amount,0); },
  saved(sv){ return sv.deposits.reduce((s,d)=>s+d.amount,0); },
  /* 規則整理的觀察（不是 AI） */
  insights(m){
    const out=[], cur=Fin.month(m), prev=Fin.month(M.add(m,-1));
    const ce=Fin.total(cur,"expense"), pe=Fin.total(prev,"expense"), ci=Fin.total(cur,"income");
    if(!cur.length) return ["這個月還沒有記帳紀錄。"];
    if(pe>0){ const d=Math.round((ce-pe)/pe*100); out.push(d>0?`本月支出比上個月多 ${d}%。`:d<0?`本月支出比上個月少 ${-d}%，很不錯。`:"本月支出和上個月差不多。"); }
    const cats=Fin.byCat(m); if(cats.length) out.push(`最大的支出是「${cats[0][0]}」，佔本月支出 ${Math.round(cats[0][1]/ce*100)}%。`);
    S.fin.budgets.forEach(b=>{ const u=Fin.used(b.cat,m); if(b.amount>0){ const r=u/b.amount; if(r>=1) out.push(`「${b.cat}」已超過預算 ${money(u-b.amount)}。`); else if(r>=.8) out.push(`「${b.cat}」已用掉預算的 ${Math.round(r*100)}%。`); } });
    if(ci>0) out.push(`本月儲蓄率 ${Math.round((ci-ce)/ci*100)}%（收入扣掉支出後留下的比例）。`);
    return out;
  }
};

}

const kGuess=(text,files=[])=>{ const t=String(text).toLowerCase(); let best=null,sc=0; Object.entries(KRULES).forEach(([k,ws])=>{ const s=ws.filter(w=>t.includes(w.toLowerCase())).length; if(s>sc){sc=s;best=k;} }); if(best) return best; if(files.length) return files.every(f=>f.type.startsWith("image/"))?"圖片":"文件"; return "筆記"; };
const kTags=text=>[...new Set((String(text).match(/#([^\s#，,。]+)/g)||[]).map(x=>x.slice(1)))];
const FileStore = {
  _db:null,
  open(){ if(this._db) return Promise.resolve(this._db); return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error("no idb")); const r=indexedDB.open("lifeos_files",1); r.onupgradeneeded=()=>r.result.createObjectStore("files"); r.onsuccess=()=>{ this._db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }); },
  async _put(id,blob){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction("files","readwrite"); tx.objectStore("files").put(blob,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async _get(id){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction("files").objectStore("files").get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); },
  async _del(id){ const db=await this.open(); return new Promise(res=>{ const tx=db.transaction("files","readwrite"); tx.objectStore("files").delete(id); tx.oncomplete=res; tx.onerror=res; }); },
  _lsKey:id=>"lifeos_f_"+id,
  _toUrl:blob=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }),
  async put(id,blob){
    try{ return await this._put(id,blob); }
    catch(e){ // 這個環境不能用 IndexedDB：改存在瀏覽器本機空間（容量較小）
      const url=await this._toUrl(blob);
      try{ LS.setItem(this._lsKey(id), url); }catch(e2){ const err=new Error("full"); err.code="full"; throw err; }
    }
  },
  async get(id){
    let b=null; try{ b=await this._get(id); }catch(e){}
    if(b) return b;
    const url=LS.getItem(this._lsKey(id)); if(!url) return null;
    const [h,d]=url.split(","), mime=(h.match(/data:([^;]+)/)||[])[1]||"application/octet-stream", bin=atob(d), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime});
  },
  async del(id){ try{ await this._del(id); }catch(e){} try{ LS.removeItem(this._lsKey(id)); }catch(e){} }
};
const blobUrls={};

/* ================= 週報與月報（依資料計算） ================= */
let rptOffset=0; sub.rpt=sub.rpt||"week";
const Report = {
  range(kind,off){
    const T=D.today();
    if(kind==="week"){ const mon=D.add(T,-((D.parse(T).getDay()+6)%7)+off*7); return {start:mon,end:D.add(mon,6),label:`${D.label(mon)}～${D.label(D.add(mon,6))}`}; }
    const m=M.add(M.cur(),off); return {start:M.start(m),end:M.end(m),label:M.label(m),month:m};
  },
  compute(r){
    const inR=d=>d>=r.start&&d<=r.end;
    const done=S.todos.filter(t=>t.status==="done"&&t.completedAt&&inR(D.fromTs(t.completedAt)));
    const open=S.todos.filter(t=>t.status==="open"&&D.fromTs(t.createdAt)<=r.end);
    const rate=done.length+open.length?Math.round(done.length/(done.length+open.length)*100):0;
    const days=Math.min(D.diff(r.start,r.end)+1, D.diff(r.start,D.today())+1);
    const habits=Habits.active().map(h=>{ const n=S.habitRecords.filter(x=>x.habitId===h.id&&inR(x.date)).length; return {h,n,pct:days>0?Math.round(n/days*100):0}; });
    const moods=S.moodRecords.filter(x=>inR(x.date)); const mc={}; moods.forEach(x=>mc[x.mood]=(mc[x.mood]||0)+1);
    const avgE=moods.length?(moods.reduce((s,x)=>s+x.energy,0)/moods.length).toFixed(1):null;
    const catDone={}, catMins={}; done.forEach(t=>{ catDone[t.category]=(catDone[t.category]||0)+1; catMins[t.category]=(catMins[t.category]||0)+(t.mins||0); });
    const stress={}; open.filter(t=>t.rolloverCount>=3||Tasks.isOverdue(t)).forEach(t=>stress[t.category]=(stress[t.category]||0)+1);
    const pts=S.reward.ledger.filter(x=>inR(x.date)).reduce((s,x)=>s+x.points,0);
    const ms=[]; S.goals.forEach(g=>g.milestones.forEach(m=>{ if(m.done&&m.doneAt&&inR(D.fromTs(m.doneAt))) ms.push(m.title); }));
    const goalsDone=S.goals.filter(g=>g.status==="done"&&g.completedAt&&inR(D.fromTs(g.completedAt)));
    const wishes=S.wishlist.filter(w=>w.status==="done"&&w.doneDate&&inR(w.doneDate));
    const exp=S.fin.tx.filter(t=>t.type==="expense"&&inR(t.date)).reduce((s,t)=>s+t.amount,0);
    const inc=S.fin.tx.filter(t=>t.type==="income"&&inR(t.date)).reduce((s,t)=>s+t.amount,0);
    let monthGoals=null; if(r.month){ const g=S.goals.filter(x=>x.level==="month"&&x.period===r.month); monthGoals={total:g.length,done:g.filter(x=>x.status==="done").length,avg:g.length?Math.round(g.reduce((s,x)=>s+Goals.progress(x),0)/g.length):0}; }
    const tips=[];
    if(done.length+open.length && rate<50) tips.push("完成率偏低沒關係，下一段時間可以少排一點，先把最重要的 3 件做完。");
    habits.filter(x=>x.pct<30 && days>=5).forEach(x=>tips.push(`「${x.h.title}」不太容易維持，可以考慮先降低難度。`));
    const low=(mc["疲累"]||0)+(mc["低落"]||0)+(mc["焦慮"]||0); if(moods.length && low/moods.length>=.5) tips.push("這段時間比較累，記得留一些完全休息的時間。");

/* ================= 全域搜尋（關鍵字＋日期規則，不是 AI） ================= */
const STOP=["幫我找","幫我查","幫我","請問","我想找","找一下","找出","找","查詢","查","一下","有關","關於","那些","哪些","什麼","時候","那個","存的","記的","寫的","去過","去","存","的","我","在","了","和","跟"];
const MODW={"待辦":"task","任務":"task","日記":"journal","心情":"journal","筆記":"kb","知識":"kb","靈感":"kb","收藏":"kb","願望":"wish","目標":"goal","記帳":"fin","花費":"fin","支出":"fin","收入":"fin","習慣":"habit","回顧":"review"};
function parseQuery(q){
  const T=D.today(); let range=null, s=" "+q+" ";
  const setR=(a,b,w)=>{ range={start:a,end:b}; s=s.replace(w," "); };
  const mon=D.add(T,-((D.parse(T).getDay()+6)%7));
  if(/上個月|上月/.test(s)){ const m=M.add(M.cur(),-1); setR(M.start(m),M.end(m),/上個月|上月/); }
  else if(/這個月|本月/.test(s)){ const m=M.cur(); setR(M.start(m),M.end(m),/這個月|本月/); }
  else if(/上週|上周|上禮拜/.test(s)) setR(D.add(mon,-7),D.add(mon,-1),/上週|上周|上禮拜/);
  else if(/這週|本週|這周|本周/.test(s)) setR(mon,D.add(mon,6),/這週|本週|這周|本周/);
  else if(/昨天/.test(s)) setR(D.add(T,-1),D.add(T,-1),/昨天/);
  else if(/今天/.test(s)) setR(T,T,/今天/);
  else if(/今年/.test(s)){ const y=T.slice(0,4); setR(y+"-01-01",y+"-12-31",/今年/); }
  else { const m=s.match(/(\d{4})[-\/年](\d{1,2})月?/)||s.match(/(?:^|\D)(\d{1,2})\s*月(?!\d)/);
    if(m){ const y=m[2]?m[1]:T.slice(0,4), mo=pad(+(m[2]||m[1])); if(+mo>=1&&+mo<=12){ const mm=y+"-"+mo; setR(M.start(mm),M.end(mm),m[0]); } } }
  let mod=null; Object.keys(MODW).forEach(w=>{ if(!mod && s.includes(w)){ mod=MODW[w]; s=s.replace(w," "); } });
  STOP.forEach(w=>{ s=s.split(w).join(" "); });
  const words=s.split(/[\s，,。、？?！!]+/).map(x=>x.trim().toLowerCase()).filter(x=>x.length>0);
  return {range, mod, words};
}
function searchAll(q, parsed){
  const {range,mod,words}=parsed||parseQuery(q);
  const items=[];
  const push=(m,id,title,text,date,open)=>items.push({m,id,title,text:String(text||""),date,open});
  S.todos.forEach(t=>push("task",t.id,t.title,[t.description,t.category].join(" "),t.scheduledDate,{edit:t.id}));
  S.journalEntries.forEach(j=>push("journal",j.id,j.type,j.text,j.date,{hub:"mood"}));
  S.moodRecords.forEach(m=>push("journal",m.id,"心情："+m.mood,m.note,m.date,{hub:"mood"}));
  S.knowledge.forEach(k=>push("kb",k.id,k.title,[k.content,k.type,k.url,...k.tags.map(t=>"#"+t)].join(" "),D.fromTs(k.createdAt),{kb:k.id}));
  S.wishlist.forEach(w=>push("wish",w.id,w.title,[w.type,w.note,w.review].join(" "),D.fromTs(w.createdAt),{hub:"wish"}));
  S.goals.forEach(g=>push("goal",g.id,g.title,[g.description,...g.milestones.map(x=>x.title)].join(" "),D.fromTs(g.createdAt),{hub:"goal"}));
  S.fin.tx.forEach(t=>push("fin",t.id,`${t.type==="income"?"收入":t.type==="expense"?"支出":"轉帳"} ${money(t.amount)}`,[t.cat,t.note].join(" "),t.date,{hub:"fin"}));
  S.habits.forEach(h=>push("habit",h.id,h.title,h.target,h.createdDate,{hub:"habit"}));
  S.reviews.forEach(r=>push("review",r.id,"每日回顧",[r.happy,r.thanks,r.tomorrow,r.note].join(" "),r.date,{hub:"review"}));
  S.personalProfile.entries.forEach(e=>push("profile",e.id,e.key,e.value+" "+e.group,D.fromTs(e.createdAt),{hub:"profile"}));
  const score=it=>{ if(mod && it.m!==mod) return -1; if(range && !(it.date>=range.start&&it.date<=range.end)) return -1;
    if(!words.length) return (range||mod)?1:-1;
    const hay=(it.title+" "+it.text).toLowerCase(); return words.filter(w=>hay.includes(w)).length; };
  let res=items.map(it=>({it,s:score(it)})).filter(x=>x.s>0);
  const full=res.filter(x=>x.s===words.length);
  res = full.length ? full : res;   // 全部關鍵字都符合的優先；沒有時才顯示部分符合
  return {res:res.sort((a,b)=>b.s-a.s||String(b.it.date).localeCompare(String(a.it.date))).map(x=>x.it).slice(0,60), range, mod, words, partial:!full.length&&res.length>0};
}

function renderSearch(q, parsed, byAI){
  const box=$("searchRes"); if(!box) return;
  if(!q.trim()){ box.innerHTML=`<p class="muted" style="margin:6px 2px">可以用關鍵字，也可以加上時間或類別，例如「上個月 韓國 餐廳」「本週 待辦」「11月 支出」。</p>`; return; }
  const r=searchAll(q, parsed);
  const cond=[r.range?`時間 ${D.short(r.range.start)}～${D.short(r.range.end)}`:"", r.mod?`類別：${MODNAME[r.mod]}`:"", r.words.length?`關鍵字：${r.words.join("、")}`:""].filter(Boolean).join("・");
  box.innerHTML=`<p class="hint" style="margin:0 2px 10px">${cond||"沒有可用的條件"}${r.partial?"（沒有完全符合的，以下是部分符合）":""}</p>`+
    (r.res.length?`<div class="list">${r.res.map(it=>`<button class="item sres" data-sopen='${esc(JSON.stringify(it.open))}'><span class="tag">${MODNAME[it.m]}</span><span class="txt"><b>${esc(it.title)}</b><br><span class="muted">${esc(it.text.slice(0,60))}</span></span><span class="muted">${it.date?D.short(it.date):""}</span></button>`).join("")}</div>`:`<div class="empty">沒有找到相關資料。</div>`);
}

/* ================= 事件 ================= */
app.addEventListener("click", e=>{
  const t=e.target;
  // 財務
  const fm=t.closest("[data-fm]"); if(fm){ finMonth=M.add(finMonth,+fm.dataset.fm); render(); return; }
  if(t.closest("#fNewTx")){ Sheet.tx(null); return; }
  const ftx=t.closest("[data-ftx]"); if(ftx){ Sheet.tx(ftx.dataset.ftx); return; }
  if(t.closest("#fNewSave")){ Sheet.saving(null); return; }
  const fse=t.closest("[data-fsedit]"); if(fse){ Sheet.saving(fse.dataset.fsedit); return; }
  const fsd=t.closest("[data-fsdep]"); if(fsd){ const id=fsd.dataset.fsdep, inp=document.querySelector(`[data-fsin="${id}"]`), v=Math.round(+inp.value); if(!(v>0)){ toast("請輸入存入金額"); return; } S.fin.savings.find(x=>x.id===id).deposits.push({id:uid(),amount:v,date:D.today()}); save(); render(); toast(`已存入 ${money(v)}`); return; }
  if(t.closest("#fAddAcc")){ const n=$("faName").value.trim(); if(!n){ toast("請輸入帳戶名稱"); return; } S.fin.accounts.push({id:uid(),name:n,type:$("faType").value,initial:Math.round(+$("faInit").value||0),createdAt:Date.now()}); save(); render(); toast("已新增帳戶"); return; }
  const fae=t.closest("[data-faedit]"); if(fae){ Sheet.account(fae.dataset.faedit); return; }
  // 第二大腦
  if(t.closest("#kNew")){ Sheet.kb(null); return; }
  const kt=t.closest("[data-kt]"); if(kt){ kType=kt.dataset.kt; render(); return; }
  const ko=t.closest("[data-kopen]"); if(ko){ Sheet.kb(ko.dataset.kopen); return; }
  // 報告
  const rp=t.closest("[data-rp]"); if(rp){ rptOffset=Math.min(0,rptOffset+(+rp.dataset.rp)); render(); return; }
  if(t.closest('.seg[data-seg="rpt"] button')) rptOffset=0;
  // 獎勵
  if(t.closest("#rwAdd")){ const n=$("rwTitle").value.trim(), c=Math.round(+$("rwCost").value); if(!n||!(c>0)){ toast("請填寫獎勵和點數"); return; } S.reward.rewards.push({id:uid(),title:n,cost:c,createdAt:Date.now()}); save(); render(); return; }
  const rg=t.closest("[data-rwget]"); if(rg){ const w=S.reward.rewards.find(x=>x.id===rg.dataset.rwget); Sheet.ask("兌換這個獎勵？",`「${esc(w.title)}」需要 ${w.cost} 點，兌換後剩 ${Reward.balance()-w.cost} 點。`,[{label:"兌換",fn:()=>{ S.reward.redemptions.push({id:uid(),rewardId:w.id,title:w.title,cost:w.cost,at:Date.now()}); save(); render(); toast("好好享受吧！"); }},{label:"取消",ghost:true}]); return; }
  const rd=t.closest("[data-rwdel]"); if(rd){ S.reward.rewards=S.reward.rewards.filter(x=>x.id!==rd.dataset.rwdel); save(); render(); return; }
  const dc=t.closest("button[data-dpick]"); if(dc&&!dc.disabled){ S.reward.deco=dc.dataset.dpick; applyDeco(); save(); render(); return; }
  // 首頁
  if(t.closest("#homeEdit")){ Sheet.homeEdit(); return; }
  const nd=t.closest("[data-ndis]"); if(nd){ const T=D.today(); S.settings.dismissed={[T]:[...((S.settings.dismissed||{})[T]||[]), nd.dataset.ndis]}; save(); render(); return; }
  // 收集：語音、檔案
  if(t.closest("#btnVoice")){ startVoice(); return; }
});
app.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.fbud){ const c=t.dataset.fbud, v=Math.round(+t.value); S.fin.budgets=S.fin.budgets.filter(b=>b.cat!==c); if(v>0) S.fin.budgets.push({id:uid(),cat:c,amount:v}); save(); render(); return; }
  if(t.dataset.rule){ S.reward.rules[t.dataset.rule]=Math.max(0,Math.round(+t.value||0)); save(); toast("已更新點數規則"); return; }
  if(t.id==="collectFiles"){ const fs=[...t.files]; t.value=""; if(!fs.length) return; const txt=$("captureInput")?.value.trim()||""; Sheet.kb(null,{title:fs.length===1?fs[0].name.replace(/\.[^.]+$/,""):`${fs.length} 個檔案`, content:txt, type:kGuess(txt,fs), files:fs}); }
});

$("sheet").addEventListener("click", e=>{
  const tt=e.target.closest("[data-txt]"); if(tt){ const type=tt.dataset.txt; Sheet._txType=type; document.querySelectorAll("#txType button").forEach(b=>b.classList.toggle("on",b===tt));
    $("txCat").innerHTML=opts(type==="income"?FIN_INC:FIN_EXP); $("txCatWrap").hidden=type==="transfer"; $("txToWrap").hidden=type!=="transfer"; $("txAccL").textContent=type==="transfer"?"從":"帳戶"; return; }
  const so=e.target.closest("[data-sopen]"); if(so){ const o=JSON.parse(so.dataset.sopen); Sheet.close();
    if(o.edit){ tab="todo"; render(); Sheet.edit(o.edit); } else if(o.kb){ tab="growth"; hub="kb"; render(); Sheet.kb(o.kb); } else if(o.hub){ tab="growth"; hub=o.hub; window.scrollTo(0,0); render(); } return; }
  const hm=e.target.closest("[data-hmv]"); if(hm){ const [k,d]=hm.dataset.hmv.split("|"); const o=S.settings.home.order, i=o.indexOf(k), j=i+(+d); if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; save(); Sheet.homeEdit(); render(); return; }

    const amt=Math.round((+$("txAmt").value)*100)/100; if(!(amt>0)){ toast("請輸入金額"); return; }
    const type=Sheet._txType; if(type==="transfer" && $("txAcc").value===$("txTo").value){ toast("轉出和轉入不能是同一個帳戶"); return; }
    const f={type, amount:amt, cat:type==="transfer"?"轉帳":$("txCat").value, accountId:$("txAcc").value, toAccountId:type==="transfer"?$("txTo").value:null, date:D.valid($("txDate").value)?$("txDate").value:D.today(), note:$("txNote").value.trim(), currency:"TWD"};
    if(id) Object.assign(S.fin.tx.find(x=>x.id===id), f); else S.fin.tx.push(Object.assign({id:uid(),createdAt:Date.now()},f));
    finMonth=f.date.slice(0,7); save(); Sheet.close(); render(); toast("已記帳");
  }
  if(act==="txDel"){ S.fin.tx=S.fin.tx.filter(x=>x.id!==id); save(); Sheet.close(); render(); toast("已刪除"); }
  if(act==="svSave"){ const ti=$("svTitle").value.trim(), tg=Math.round(+$("svTarget").value); if(!ti||!(tg>0)){ toast("請填寫目標和金額"); return; }
    const f={title:ti,target:tg,deadline:D.valid($("svDl").value)?$("svDl").value:null}; if(id) Object.assign(S.fin.savings.find(x=>x.id===id),f); else S.fin.savings.push(Object.assign({id:uid(),deposits:[],createdAt:Date.now()},f)); save(); Sheet.close(); render(); }
  if(act==="svDel"){ Sheet.ask("刪除這個儲蓄目標？","存入紀錄也會一起刪除。",[{label:"刪除",fn:()=>{ S.fin.savings=S.fin.savings.filter(x=>x.id!==id); save(); render(); }},{label:"取消",ghost:true}]); }
  if(act==="depDel"){ const sv=S.fin.savings.find(x=>x.id===id); sv.deposits=sv.deposits.filter(d=>d.id!==a.dataset.dep); save(); Sheet.saving(id); render(); }
  if(act==="accSave"){ const ac=Fin.acc(id), n=$("eaName").value.trim(); if(!n) return; Object.assign(ac,{name:n,type:$("eaType").value,initial:Math.round(+$("eaInit").value||0)}); save(); Sheet.close(); render(); }
  if(act==="accDel"){ S.fin.accounts=S.fin.accounts.filter(x=>x.id!==id); save(); Sheet.close(); render(); }
  if(act==="kSave"){ saveKb(id); }
  if(act==="kDel"){ const k=S.knowledge.find(x=>x.id===id); Sheet.ask("刪除這筆資料？","附加的圖片和文件也會一起刪除。",[{label:"刪除",fn:async()=>{ for(const f of k.files) await FileStore.del(f.id).catch(()=>{}); S.knowledge=S.knowledge.filter(x=>x.id!==id); save(); render(); }},{label:"取消",ghost:true}]); }
  if(act==="kFileDel"){ const k=S.knowledge.find(x=>x.id===id); const fid=a.dataset.file; k.files=k.files.filter(f=>f.id!==fid); FileStore.del(fid).catch(()=>{}); save(); Sheet.kb(id); render(); }
});

async function saveKb(id){
  const title=$("kTitle").value.trim(); if(!title){ toast("請輸入標題"); return; }
  const content=$("kContent").value.trim(), now=Date.now();
  const newFiles=[];
  for(const f of (Sheet._kFiles||[])){ const fid=uid(); try{ await FileStore.put(fid,f); newFiles.push({id:fid,name:f.name,mime:f.type||"application/octet-stream",size:f.size}); }catch(err){ toast("這個瀏覽器無法儲存檔案"); return; } }
  const f={title,content,type:$("kType").value,url:$("kUrl").value.trim(),tags:kTags(content+" "+title),updatedAt:now};
  if(id){ const k=S.knowledge.find(x=>x.id===id); Object.assign(k,f); k.files=[...k.files,...newFiles]; }
  else S.knowledge.push(Object.assign({id:uid(),createdAt:now,files:newFiles},f));
  Sheet._kFiles=[]; Sheet._kTypeTouched=false; save(); Sheet.close(); if(tab==="collect"){ toast("已存進第二大腦"); } render(); if(tab!=="collect") toast("已儲存");
}

/* 語音輸入：使用瀏覽器內建的語音辨識；不支援的瀏覽器不顯示按鈕 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null;
function startVoice(){
  if(!SR) return;
  if(rec){ rec.stop(); return; }
  rec=new SR(); rec.lang="zh-TW"; rec.interimResults=false; rec.continuous=false;
  const btn=$("btnVoice"); btn?.classList.add("rec");
  rec.onresult=ev=>{ const txt=[...ev.results].map(r=>r[0].transcript).join(""); const ta=$("captureInput"); if(ta){ ta.value=(ta.value?ta.value.replace(/\s*$/,"\n"):"")+txt; S.draft=ta.value; save(); } };
  rec.onerror=ev=>{ toast(ev.error==="not-allowed"?"沒有麥克風權限，請在瀏覽器設定中允許":"語音辨識沒有成功，請再試一次"); };
  rec.onend=()=>{ rec=null; $("btnVoice")?.classList.remove("rec"); };
  try{ rec.start(); toast("請開始說話…"); }catch(err){ rec=null; }
}

/* 下載檔案：在 Claude 裡用 Claude 的下載確認；下載的檔案版本用瀏覽器下載 */
async function offerFile(name, data){
  if(window.claude && typeof window.claude.use==="function"){
    const dl=await window.claude.use("downloads").catch(()=>null);
    if(!dl){ toast("這裡無法下載檔案"); return false; }
    try{ await dl.save({filename:name, data}); return true; }
    catch(e){ const c=e&&e.code; if(c==="declined") return false; toast(c==="rejected_extension"?"這種檔案格式在 Claude 裡無法下載":c==="rate_limited"?"請稍後再試一次":"下載沒有成功"); return false; }
  }
  const blob=data instanceof Blob?data:new Blob([data],{type:"application/json"});
  // 從主畫面打開（iPhone）時，用分享選單存檔，避免整個 App 被換成檔案頁面
  if(IS_STANDALONE){ try{ const file=new File([blob],name,{type:blob.type||"application/octet-stream"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return true; } }
    catch(e){ if(e && e.name==="AbortError") return false; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.target="_blank"; a.rel="noopener";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },60000); return true;
}
/* 匯出時連同圖片與文件一起打包；匯入時寫回 IndexedDB */
const blobToDataUrl=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); });
Backup.exportFile=async function(){
  const files={};
  for(const id of allFileIds()){ try{ const b=await FileStore.get(id); if(b) files[id]=await blobToDataUrl(b); }catch(e){} }
  const payload={app:"Life OS 生活整理工具箱", exportedAt:new Date().toISOString(), schemaVersion:SCHEMA, data:S, files};
  const ok=await offerFile(`生活工具檯備份_${D.today()}.json`, new Blob([JSON.stringify(payload)],{type:"application/json"}));
  if(ok){ S.settings.lastExport=D.today(); save(); }
  if(ok) toast(`已匯出備份檔${Object.keys(files).length?`（含 ${Object.keys(files).length} 個檔案）`:""}`);
};
let pendingImportFiles=null;
const _bRead=Backup.read;
Backup.read=function(text){ try{ const o=JSON.parse(text); pendingImportFiles=o&&o.files||null; }catch(e){ pendingImportFiles=null; } return _bRead.call(Backup,text); };
async function restoreImportFiles(){ if(!pendingImportFiles) return; for(const [id,du] of Object.entries(pendingImportFiles)){ try{ const b=await (await fetch(du)).blob(); await FileStore.put(id,b); }catch(e){} } pendingImportFiles=null; }
const _bMerge=Backup.merge;
Backup.merge=function(d){ const n=_bMerge.call(Backup,d);
  const has=(arr,id)=>arr.some(x=>x.id===id);
  ["accounts","tx","budgets","savings"].forEach(k=>d.fin[k].forEach(x=>{ if(k==="budgets"){ if(!S.fin.budgets.some(b=>b.cat===x.cat)) S.fin.budgets.push(x); } else if(!has(S.fin[k],x.id)) S.fin[k].push(x); }));
  d.knowledge.forEach(x=>{ if(!has(S.knowledge,x.id)) S.knowledge.push(x); });
  d.reward.ledger.forEach(x=>{ if(!S.reward.ledger.some(y=>y.key===x.key)) S.reward.ledger.push(x); });
  ["rewards","redemptions"].forEach(k=>d.reward[k].forEach(x=>{ if(!has(S.reward[k],x.id)) S.reward[k].push(x); }));
  Object.entries(d.reward.badges).forEach(([k,v])=>{ if(!S.reward.badges[k]) S.reward.badges[k]=v; });
  restoreImportFiles(); return n; };

/* =====================================================================
   17. ✨ 星光秘境（純前端：內容庫＋固定規則；月相用天文公式計算）
   每個人有自己的隨機種子（S.star.profile.seed），同一天結果固定、每天不同、每個人不同。
   ===================================================================== */
function _hash(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^h>>>16)>>>0; }
function srng(key){ let a=_hash(String(S.star.profile.seed||"seed")+"|"+key); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const Moon = {
  rad:d=>d*Math.PI/180,
  jde(k){

    let jde=2451550.09766+29.530588861*k+0.00015437*T2-0.000000150*T3+0.00000000073*T4;
    const E=1-0.002516*T-0.0000074*T2;
    const M=r(2.5534+29.10535670*k-0.0000014*T2-0.00000011*T3);
    const Mp=r(201.5643+385.81693528*k+0.0107582*T2+0.00001238*T3-0.000000058*T4);
    const F=r(160.7108+390.67050284*k-0.0016118*T2-0.00000227*T3+0.000000011*T4);
    const O=r(124.7746-1.56375588*k+0.0020672*T2+0.00000215*T3);
    const s=Math.sin, c=Math.cos, frac=((k%1)+1)%1;
    let x=0;
    if(Math.abs(frac)<1e-6 || Math.abs(frac-0.5)<1e-6){
      const n=Math.abs(frac)<1e-6;
      x = (n?-0.40720:-0.40614)*s(Mp) + (n?0.17241:0.17302)*E*s(M) + (n?0.01608:0.01614)*s(2*Mp) + (n?0.01039:0.01043)*s(2*F)
        + (n?0.00739:0.00734)*E*s(Mp-M) - (n?0.00514:0.00515)*E*s(Mp+M) + (n?0.00208:0.00209)*E*E*s(2*M)
        - 0.00111*s(Mp-2*F) - 0.00057*s(Mp+2*F) + 0.00056*E*s(2*Mp+M) - 0.00042*s(3*Mp) + 0.00042*E*s(M+2*F)
        + 0.00038*E*s(M-2*F) - 0.00024*E*s(2*Mp-M) - 0.00017*s(O) - 0.00007*s(Mp+2*M) + 0.00004*s(2*Mp-2*F)
        + 0.00004*s(3*M) + 0.00003*s(Mp+M-2*F) + 0.00003*s(2*Mp+2*F) - 0.00003*s(Mp+M+2*F) + 0.00003*s(Mp-M+2*F)
        - 0.00002*s(Mp-M-2*F) - 0.00002*s(3*Mp+M) + 0.00002*s(4*Mp);
    } else {

        + 0.00204*E*E*s(2*M) - 0.00180*s(Mp-2*F) - 0.00070*s(Mp+2*F) - 0.00040*s(3*Mp) - 0.00034*E*s(2*Mp-M)
        + 0.00032*E*s(M+2*F) + 0.00032*E*s(M-2*F) - 0.00028*E*E*s(Mp+2*M) + 0.00027*E*s(2*Mp+M) - 0.00017*s(O)
        - 0.00005*s(Mp-M-2*F) + 0.00004*s(2*Mp+2*F) - 0.00004*s(Mp+M+2*F) + 0.00004*s(Mp-2*M) + 0.00003*s(Mp+M-2*F)
        + 0.00003*s(3*M) + 0.00002*s(2*Mp-2*F) + 0.00002*s(Mp-M+2*F) - 0.00002*s(3*Mp+M);
      const W=0.00306-0.00038*E*c(M)+0.00026*c(Mp)-0.00002*c(Mp-M)+0.00002*c(Mp+M)+0.00002*c(2*F);

    return {e:b[1], name:b[2]};
  },
  next(type, fromStr=D.today()){ return this.between(fromStr, D.add(fromStr,40)).find(e=>e.type===type); }
};

function sunSign(dateStr){
  const d=D.parse(dateStr), m=d.getMonth()+1, day=d.getDate();
  const z=ZODIAC.find(z=>{ const [fm,fd]=z.from, [tm,td]=z.to; return fm<=tm ? ((m>fm||(m===fm&&day>=fd))&&(m<tm||(m===tm&&day<=td))) : ((m>fm||(m===fm&&day>=fd))||(m<tm||(m===tm&&day<=td))); });
  const cusp=ZODIAC.some(x=>{ const [fm,fd]=x.from, [tm,td]=x.to; return (m===fm&&Math.abs(day-fd)<=1)||(m===tm&&Math.abs(day-td)<=1); });
  return {z, cusp};
}

async function compressImage(file){
  if(file.type && !file.type.startsWith("image/")) throw new Error("not image");
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s=Math.min(1,((()=>{try{return !!window.indexedDB}catch(e){return false}})()?1600:1000)/Math.max(img.width,img.height)), cv=document.createElement("canvas");
    cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(b=>res(b||file),"image/jpeg",0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function storeImages(files){ const ids=[]; if(files.length) toast("圖片處理中…");
  for(const f of files){
    if(f.type && !f.type.startsWith("image/")){ toast("這個檔案不是圖片"); continue; }
    let b; try{ b=await compressImage(f); }catch(e){ b=f; }   // 無法縮小（例如部分 HEIC）就保留原檔
    try{ const id=uid(); await FileStore.put(id,b); ids.push(id); }
    catch(e){ toast(e&&e.code==="full"?"這台裝置的儲存空間不夠，圖片沒有存進去":"圖片沒有存進去，請再試一次"); }
  }
  if(ids.length) toast(`已加入 ${ids.length} 張圖片`); return ids; }
const imgStrip=(ids,key)=>ids.length?`<div class="kfiles">${ids.map(id=>`<div class="kf"><img data-fthumb="${id}" alt=""><button class="del" data-imgdel="${key}|${id}" aria-label="移除">${ic("x")}</button></div>`).join("")}</div>`:"";

  Sheet._wid=id||null;
  const goals=S.goals.filter(g=>g.status==="active"||g.id===w.goalId);
  Sheet.open(`<h3>${src?"編輯願望":"🌠 許一個新願望"}</h3>
    <label class="fld"><span>願望</span><input id="wTitle" value="${esc(w.title)}" placeholder="例如：去京都看紅葉"></label>
    <label class="fld" style="margin-top:10px"><span>願望描述</span><textarea id="wDesc" class="sm">${esc(w.desc)}</textarea></label>
    <div class="grid2" style="margin-top:10px">
      <label class="fld"><span>分類</span><select id="wCat">${WISH_CATS.map(([k,e,n])=>`<option value="${k}" ${k===w.category?"selected":""}>${e} ${n}</option>`).join("")}</select></label>
      <label class="fld"><span>狀態</span><select id="wStatus">${WISH_STATUS.map(([k,e,n])=>`<option value="${k}" ${k===w.mstatus?"selected":""}>${e} ${n}</option>`).join("")}</select></label>
      <label class="fld"><span>目標日期</span><input type="date" id="wTarget" value="${w.targetDate||""}"></label>
      <label class="fld"><span>優先程度</span><select id="wPri">${opts(["高","中","低"],w.priority)}</select></label>
      <label class="fld"><span>預算（新台幣）</span><input id="wBudget" type="number" inputmode="numeric" min="0" value="${w.budget??""}" placeholder="可不填"></label>
      <label class="fld"><span>連結目標</span><select id="wGoal"><option value="">不連結</option>${goals.map(g=>`<option value="${g.id}" ${g.id===w.goalId?"selected":""}>${GLEVEL[g.level]}・${esc(g.title)}</option>`).join("")}</select></label>
    </div>
    <label class="fld" style="margin-top:10px"><span>顯化進度：<b id="wProgV">${w.progress}</b>%</span><input type="range" id="wProg" min="0" max="100" step="5" value="${w.progress}"></label>
    <label class="fld" style="margin-top:10px"><span>為什麼想實現這個願望？</span><textarea id="wWhy" class="sm">${esc(w.why)}</textarea></label>
    <div class="sec" style="margin-top:16px">實際行動</div>
    <div id="wActs">${wActsHtml()}</div>
    <div class="hrow" style="flex-wrap:nowrap;margin-top:8px"><input id="wActNew" placeholder="新增一個可以做的行動"><button class="btn small ghost" data-wactadd="1">新增</button></div>
    <div class="sec" style="margin-top:16px">願景圖片</div>
    <div id="wImgs">${imgStrip(w.images,"w")}</div>
    <label class="btn ghost small" style="margin-top:6px">${ic("image")}加入圖片<input type="file" id="wImgFile" accept="image/*" multiple hidden></label>
    <div class="sec" style="margin-top:16px">心得紀錄</div>
    <div id="wNotes">${w.notes.map(n=>`<p class="muted" style="margin:4px 0">${D.short(D.fromTs(n.at))}・${esc(n.text)}</p>`).join("")}</div>
    <div class="hrow" style="flex-wrap:nowrap;margin-top:6px"><input id="wNoteNew" placeholder="寫下最近的進展或感受"><button class="btn small ghost" data-wnoteadd="1">新增</button></div>

    <div class="grid2"><label class="fld"><span>完成日期</span><input type="date" id="wDoneDate" value="${w.doneDate||""}"></label><label class="fld"><span>實際花費（新台幣）</span><input id="wCost" type="number" inputmode="numeric" min="0" value="${w.actualCost??""}"></label></div>
    <label class="fld" style="margin-top:10px"><span>完成回顧</span><textarea id="wReview" class="sm">${esc(w.review||"")}</textarea></label>
    <div class="hrow" style="margin-top:16px"><button class="btn" data-wsave="1" style="flex:1">儲存</button><button class="btn ghost" data-act="close">取消</button></div>
    ${src?`<button class="btn ghost full" data-wdel="1" style="margin-top:10px;color:var(--rose-ink)">刪除這個願望</button>`:""}`);
  fillThumbs();

function wActsHtml(){ const w=Sheet._w; return w.actions.length?w.actions.map(a=>{ const t=a.taskId&&Tasks.get(a.taskId); return `<div class="item" style="padding:8px 10px"><input type="checkbox" data-wact="${a.id}" ${a.done?"checked":""} aria-label="完成"><span class="txt" style="min-width:0">${esc(a.text)}</span>${t?`<span class="tag">已轉成待辦</span>`:Sheet._wid?`<button class="btn small ghost" data-wtask="${a.id}">轉成待辦</button>`:""}<button class="del" data-wactdel="${a.id}" aria-label="刪除">${ic("x")}</button></div>`; }).join(""):`<p class="muted" style="margin:0">把願望拆成可以做的小行動。</p>`; }

  const o=s.originalSnapshot;
  Sheet.open(`<h3>🏆 ${src?"編輯成功紀錄":"加入顯化成功紀錄牆"}</h3>

      <label class="fld"><span>分類</span><select id="sCat">${WISH_CATS.map(([k,e,n])=>`<option value="${k}" ${k===s.category?"selected":""}>${e} ${n}</option>`).join("")}</select></label></div>
    ${o?`<div class="histbox"><b>願望原始內容</b>（加入時保存，不會被修改）<div>${esc(o.title)}${o.desc?`：${esc(o.desc)}`:""}</div>${o.why?`<div>為什麼：${esc(o.why)}</div>`:""}<div>許願日期：${D.short(D.fromTs(o.createdAt))}</div></div>`:""}
    <label class="fld" style="margin-top:10px"><span>實現過程</span><textarea id="sProc" class="sm">${esc(s.process)}</textarea></label>
    <label class="fld" style="margin-top:10px"><span>我的心得</span><textarea id="sRef" class="sm">${esc(s.reflection)}</textarea></label>
    <label class="fld" style="margin-top:10px"><span>當時的心情</span><input id="sMood" value="${esc(s.mood)}" placeholder="例如：不敢相信、好感動"></label>
    <label class="fld" style="margin-top:10px"><span>想對過去的自己說的話</span><textarea id="sPast" class="sm">${esc(s.toPastSelf)}</textarea></label>
    <div class="sec" style="margin-top:16px">相關照片</div><div id="sImgs">${imgStrip(s.photos,"s")}</div>
    <label class="btn ghost small" style="margin-top:6px">${ic("image")}加入照片<input type="file" id="sImgFile" accept="image/*" multiple hidden></label>
    <div class="hrow" style="margin-top:16px"><button class="btn" data-ssave="1" style="flex:1">儲存</button><button class="btn ghost" data-act="close">取消</button></div>
    ${src?`<button class="btn ghost full" data-sdel="1" style="margin-top:10px;color:var(--rose-ink)">刪除這筆成功紀錄</button>`:""}`);
  fillThumbs();
};

  const T=D.today(), inf=Moon.dayInfo(T), ph=type==="note"?(inf.exact?inf.exact.type:"note"):type, th=MOON_THEMES[type];
  Sheet._moonType=ph;
  Sheet.open(`<h3>${type==="new"?"🌑 新月許願":type==="full"?"🌕 滿月釋放":"📝 月相日記"}</h3>

};

function homeAffirm(){ const a=affToday(); return `<div class="sec">💌 今日肯定語</div><div class="card quote tap" data-gostar="affirm"><div class="qk">✨ TODAY'S AFFIRMATION</div><div class="qt">${a.t}</div><div class="qf"><span>星光秘境・每日肯定語</span><span class="chev">${ic("chev")}</span></div></div>`; }

/* ---------- 事件 ---------- */
function goStar(page){ tab="card"; starPage=page||null; window.scrollTo(0,0); render(); }
function zLog(period){ const z=zByKey(S.star.profile.zodiac); if(!z) return; const t=zText(z,period); if(!S.star.horoscopeLog.some(h=>h.sign===z.key&&h.period===period&&h.date===(period==="day"?D.today():t.pk))){ S.star.horoscopeLog.push({id:uid(),date:period==="day"?D.today():t.pk,sign:z.key,period,textSnapshot:[t.all,t.love,t.money,t.work].join(" "),at:Date.now()}); save(); } }
function recDelete(kind,id){
  const st=S.star;
  if(kind==="draw") st.draws=st.draws.filter(x=>x.id!==id);
  if(kind==="legacy") S.cards=S.cards.filter(x=>x.date!==id);
  if(kind==="aff") st.affirmations=st.affirmations.filter(x=>x.id!==id);
  if(kind==="zod") st.horoscopeLog=st.horoscopeLog.filter(x=>x.id!==id);
  if(kind==="moon") st.moonJournal=st.moonJournal.filter(x=>x.id!==id);
  if(kind==="mj") st.manifestJournal=st.manifestJournal.filter(x=>x.id!==id);
  if(kind==="grat") st.gratitude=st.gratitude.filter(x=>x.id!==id);
  if(kind==="soul") st.soulQA=st.soulQA.filter(x=>x.id!==id);
  if(kind==="angel") st.angelNumbers=st.angelNumbers.filter(x=>x.id!==id);
  if(kind==="success"){ st.successes=st.successes.filter(x=>x.id!==id); S.wishlist.forEach(w=>{ if(w.successId===id) w.successId=null; }); }
}
function recFavToggle(kind,id){ const arr={draw:S.star.draws,aff:S.star.affirmations,mj:S.star.manifestJournal,soul:S.star.soulQA}[kind]; const x=arr&&arr.find(i=>i.id===id); if(x){ x.fav=!x.fav; save(); render(); } }
function askDelete(msg, fn){ Sheet.ask("確定要刪除嗎？", msg||"刪除後無法復原（除非從備份還原）。", [{label:"刪除",fn},{label:"取消",ghost:true}]); }

app.addEventListener("click", e=>{
  const t=e.target, T=D.today();
  const gs=t.closest("[data-gostar]"); if(gs){ goStar(gs.dataset.gostar==="home"?null:gs.dataset.gostar); return; }
  const sp=t.closest("[data-sp]"); if(sp){ const p=sp.dataset.sp||null; if(sp.dataset.rtool) recTool=sp.dataset.rtool; if(p!=="oracle") oLast=null; if(p==="jiao"&&jiaoSess){ const l=jiaoSess.throws[jiaoSess.throws.length-1]; if(jiaoSess.mode==="once"||l!=="sheng"||jiaoSess.throws.length>=3) jiaoSess=null; } animId=null; goStar(p); return; }
  if(tab!=="card" && !t.closest("[data-wnew],[data-wedit]")) return;
  const sg=t.closest('.seg[data-seg="oracle"] button'); if(sg){ oLast=null; animId=null; render(); return; }
  const sz=t.closest('.seg[data-seg="zod"] button'); if(sz){ zLog(sz.dataset.v); render(); return; }
  // 神諭卡
  const od=t.closest("[data-odraw]"); if(od){ const m=od.dataset.odraw;
    if(m==="daily"){ if(S.star.draws.some(d=>d.tool==="oracle"&&d.mode==="daily"&&d.date===T)) return; const c=oracleFor(T); const r=drawRec("oracle","daily",[{deck:"angel-v2",cardId:c.id}]); animId=r.id; }
    else { if(m==="theme"&&!oTheme) return; const c=ANGEL_DECK[Math.floor(Math.random()*ANGEL_DECK.length)]; const r=drawRec("oracle",m,[{deck:"angel-v2",cardId:c.id}],m==="theme"?{theme:oTheme}:{}); oLast=r.id; animId=r.id; }
    save(); render(); return; }
  const ot=t.closest("[data-otheme]"); if(ot){ oTheme=ot.dataset.otheme; oLast=null; render(); return; }
  const sf=t.closest("[data-sfav]"); if(sf){ const r=S.star.draws.find(d=>d.id===sf.dataset.sfav); if(r){ r.fav=!r.fav; animId=null; save(); render(); } return; }
  const sn=t.closest("[data-snotesave]"); if(sn){ const r=S.star.draws.find(d=>d.id===sn.dataset.snotesave), ta=document.querySelector(`[data-snote="${sn.dataset.snotesave}"]`); if(r&&ta){ r.note=ta.value.trim(); animId=null; save(); render(); toast("已儲存感受"); } return; }
  // 運勢籤
  if(t.closest("[data-fdraw]")){ if(fortuneShake||S.star.draws.some(d=>d.tool==="fortune"&&d.mode==="daily"&&d.date===T)) return; fortuneShake=true; render();
    setTimeout(()=>{ fortuneShake=false; const f=fortuneFor(T); const r=drawRec("fortune","daily",[{deck:"fortune-v1",cardId:f.id}]); animId=r.id; save(); render(); }, matchMedia("(prefers-reduced-motion: reduce)").matches?0:900); return; }
  // 肯定語
  const af=t.closest("[data-afav]"); if(af){ const id=af.dataset.afav, date=af.dataset.adate||T; let lg=S.star.affirmations.find(a=>a.date===date&&a.affId===id); if(!lg){ lg={id:uid(),date,affId:id,fav:false,feeling:"",at:Date.now()}; S.star.affirmations.push(lg); } lg.fav=!lg.fav; save(); render(); return; }
  const ac=t.closest("[data-acopy]"); if(ac){ const tx=AFF(ac.dataset.acopy).t; (navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>toast("已複製"),()=>toast("無法複製，請長按文字自行複製")); return; }
  const afl=t.closest("[data-afeel]"); if(afl){ const id=afl.dataset.afeel; let lg=S.star.affirmations.find(a=>a.date===T&&a.affId===id); if(!lg){ lg={id:uid(),date:T,affId:id,fav:false,feeling:"",at:Date.now()}; S.star.affirmations.push(lg); } lg.feeling=$("affFeel").value.trim(); save(); render(); toast("已儲存"); return; }
  if(t.closest("[data-amore]")){ let a; do{ a=AFFIRMATIONS[Math.floor(Math.random()*AFFIRMATIONS.length)]; }while(a.id===affToday().id); affExtra=a.id; render(); return; }
  // 三張牌
  const spr=t.closest("[data-spr]"); if(spr){ sprSel=spr.dataset.spr; sprLast=null; render(); return; }
  if(t.closest("[data-sprdraw]")){ const ids=[...ANGEL_DECK].sort(()=>Math.random()-0.5).slice(0,3).map(c=>c.id); const r=drawRec("spread","free",ids.map((id,i)=>({deck:"angel-v2",cardId:id,position:i})),{spread:sprSel,question:$("sprQ").value.trim()}); sprLast=r.id; animId=r.id; save(); render(); return; }
  // 願望
  if(t.closest("[data-wnew]")){ Sheet.wishEdit(null); return; }
  const we=t.closest("[data-wedit]"); if(we){ Sheet.wishEdit(we.dataset.wedit); return; }
  const wf=t.closest("[data-wf]"); if(wf){ wishFilter=wf.dataset.wf; render(); return; }
  // 願景板
  if(t.closest("[data-vnew]")){ Sheet.visionEdit(null); return; }
  const ve=t.closest("[data-vedit]"); if(ve){ Sheet.visionEdit(ve.dataset.vedit); return; }
  // 顯化日記
  if(t.closest("[data-mjnext]")){ mjPromptIdx++; render(); return; }
  const mjs=t.closest("[data-mjsave]"); if(mjs){ const tx=$("mjText").value.trim(); if(!tx){ toast("先寫一點內容"); return; } const fr=mjs.dataset.mjsave==="free"; S.star.manifestJournal.push({id:uid(),date:T,promptId:fr?null:mjs.dataset.mjsave,free:fr,text:tx,wishId:$("mjWish").value||null,fav:false,tags:[],at:Date.now()}); save(); render(); toast(fr?"🌈 願望已寫下":"已儲存"); return; }
  const mjf=t.closest("[data-mjfav]"); if(mjf){ recFavToggle("mj",mjf.dataset.mjfav); return; }
  const mjd=t.closest("[data-mjdel]"); if(mjd){ const id=mjd.dataset.mjdel; askDelete(null,()=>{ recDelete("mj",id); save(); render(); }); return; }
  // 感恩
  const gm=t.closest("[data-gmood]"); if(gm){ document.querySelectorAll("[data-gmood]").forEach(b=>b.classList.toggle("on",b===gm&&!b.classList.contains("on"))); return; }
  if(t.closest("[data-grsave]")){
    const items=[0,1,2].map(i=>$("gr"+i).value.trim()), extra=$("grExtra").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    if(!items.some(Boolean)&&!extra.length){ toast("至少寫下一件感恩的事"); return; }
    const mood=document.querySelector("[data-gmood].on")?.dataset.gmood||"";
    let g=S.star.gratitude.find(x=>x.date===T); if(!g){ g={id:uid(),date:T,items:[],extra:[],moodTag:"",linkedJournalId:null,at:Date.now()}; S.star.gratitude.push(g); }
    Object.assign(g,{items,extra,moodTag:mood,at:Date.now()});
    const text="感恩："+[...items,...extra].filter(Boolean).join("、");
    if($("grSync").checked){ const j=g.linkedJournalId&&S.journalEntries.find(x=>x.id===g.linkedJournalId); if(j) j.text=text; else { const nj={id:uid(),date:T,type:"感謝",text,at:Date.now(),source:"感恩日記"}; S.journalEntries.push(nj); g.linkedJournalId=nj.id; } }
    else if(g.linkedJournalId){ g.linkedJournalId=null; }
    save(); render(); toast("已儲存今天的感恩"); return; }
  const grm=t.closest("[data-grm]"); if(grm){ gratMonth=M.add(gratMonth||T.slice(0,7),+grm.dataset.grm); render(); return; }
  // 成功紀錄
  if(t.closest("[data-snew]")){ Sheet.successEdit(null,null); return; }
  const se=t.closest("[data-sedit]"); if(se){ Sheet.successEdit(se.dataset.sedit); return; }
  const sv=t.closest("[data-sv]"); if(sv){ succView=sv.dataset.sv; render(); return; }
  const sy=t.closest("[data-sy]"); if(sy){ succYear=sy.dataset.sy; render(); return; }
  const sc=t.closest("[data-sc]"); if(sc){ succCat=sc.dataset.sc; render(); return; }
  // 星座與星盤

  const wt=t.closest("[data-wtask]"); if(wt){
    const w=readWishForm(); if(!w.title){ toast("請先寫下願望"); return; }

    const a=stored.actions.find(x=>x.id===wt.dataset.wtask); if(!a) return;

    Sheet.ask("轉成待辦？",`會在今天的待辦新增「${esc(a.text)}」（${cat}），並和這個願望保持連結。`,[
      {label:"建立待辦",fn:()=>{ const tk=Tasks.create({title:a.text,category:cat,priority:stored.priority,goalId:stored.goalId}); a.taskId=tk.id; save(); render(); Sheet.wishEdit(wid); toast("已建立待辦"); }},
      {label:"取消",ghost:true,fn:()=>Sheet.wishEdit(wid)}]);
    return; }
  if(t.closest("[data-wsave]")){
    const w=readWishForm(); if(!w.title){ toast("請寫下願望"); return; }
    w.updatedAt=Date.now(); let stored;
    if(Sheet._wid){ stored=S.wishlist.find(x=>x.id===Sheet._wid); Object.assign(stored,w); } else { stored=Object.assign({id:uid(),createdAt:Date.now(),currency:"TWD",successId:null},w); S.wishlist.push(stored); }
    if(stored.mstatus==="achieved" && stored.progress<100) stored.progress=100;
    wishNormalize(stored); wishSyncLegacy(stored); save(); Sheet.close(); render();
    if(stored.mstatus==="achieved" && !stored.successId){ Sheet.ask("🏆 恭喜願望實現！","要把它加入「顯化成功紀錄牆」嗎？原本的願望會保留，並和成功紀錄互相連結。",[{label:"加入成功紀錄牆",fn:()=>Sheet.successEdit(null,stored.id)},{label:"之後再說",ghost:true}]); }
    else toast("已儲存願望");
    return; }
  if(t.closest("[data-wdel]")){ const id=Sheet._wid, w=S.wishlist.find(x=>x.id===id); Sheet.ask("刪除這個願望？",`「${esc(w.title)}」會被刪除。${w.successId?"成功紀錄牆上的紀錄會保留（含願望原始內容）。":""}`,[{label:"刪除",fn:()=>{ S.wishlist=S.wishlist.filter(x=>x.id!==id); S.star.vision.forEach(v=>{ if(v.wishId===id) v.wishId=null; }); save(); render(); }},{label:"取消",ghost:true}]); return; }
  if(t.closest("[data-ssave]")){

    if(!s.title){ toast("請填寫願望名稱"); return; }
    let stored; if(Sheet._sid){ stored=S.star.successes.find(x=>x.id===Sheet._sid); Object.assign(stored,s); } else { stored=Object.assign({id:uid(),createdAt:Date.now()},s); S.star.successes.push(stored); }
    const w=stored.wishId&&S.wishlist.find(x=>x.id===stored.wishId); if(w) w.successId=stored.id;
    save(); Sheet.close(); render(); toast("已加入成功紀錄牆"); return; }
  if(t.closest("[data-sdel]")){ const id=Sheet._sid; Sheet.ask("刪除這筆成功紀錄？","原本的願望會保留，狀態不變。",[{label:"刪除",fn:()=>{ recDelete("success",id); save(); render(); }},{label:"取消",ghost:true}]); return; }
  const vp=t.closest("[data-vpre]"); if(vp){ Sheet._v.preset=vp.dataset.vpre; Sheet._v.fileId=null; const p=VISION_PRESETS.find(x=>x[0]===vp.dataset.vpre); $("vImg").innerHTML=`<div class="vpre big" style="background:${p[2]}"><span>${p[1]}</span></div>`; return; }
  const vm=t.closest("[data-vmove]"); if(vm){ const list=[...S.star.vision].sort((a,b)=>a.order-b.order), i=list.findIndex(v=>v.id===Sheet._vid), j=i+(+vm.dataset.vmove); if(j<0||j>=list.length) return; const o=list[i].order; list[i].order=list[j].order; list[j].order=o; save(); render(); toast("已移動"); return; }
  if(t.closest("[data-vsave]")){ const v=Sheet._v; Object.assign(v,{caption:$("vCap").value.trim(),category:$("vCat").value,wishId:$("vWish").value||null,achieved:$("vDone").checked});

    save(); Sheet.close(); render(); toast("已儲存願景"); return; }
  if(t.closest("[data-vdel]")){ const id=Sheet._vid; askDelete("這張願景會被刪除。",()=>{ S.star.vision=S.star.vision.filter(x=>x.id!==id); save(); render(); }); return; }

});

/* 匯出星光秘境紀錄 */
function starExport(kind){
  if(kind==="json"){ offerFile(`星光秘境紀錄_${D.today()}.json`, new Blob([JSON.stringify({app:"Life OS 星光秘境",exportedAt:new Date().toISOString(),star:S.star,wishes:S.wishlist,legacyFortune:S.cards},null,2)],{type:"application/json"})); return; }
  const lines=["生活工具檯・星光秘境 探索紀錄",`匯出日期：${D.today()}`,""];
  recItems().forEach(x=>{ lines.push(`【${x.date}】${x.title}`); if(x.text) lines.push(x.text); lines.push(""); });
  offerFile(`星光秘境紀錄_${D.today()}.txt`, new Blob([lines.join("\n")],{type:"text/plain"}));
}

function allFileIds(){ const s=new Set(); S.knowledge.forEach(k=>k.files.forEach(f=>s.add(f.id))); S.wishlist.forEach(w=>(w.images||[]).forEach(i=>s.add(i))); S.star.successes.forEach(x=>x.photos.forEach(i=>s.add(i))); S.star.vision.forEach(v=>v.fileId&&s.add(v.fileId)); return [...s]; }

/* 匯入合併：星光秘境資料（以 id 去重；每日唯一的以日期去重） */
const _bMerge2=Backup.merge;
Backup.merge=function(d){ const n=_bMerge2.call(Backup,d);
  const has=(arr,id)=>arr.some(x=>x.id===id), st=S.star, ds=d.star||{};
  ["draws","affirmations","vision","manifestJournal","gratitude","successes","horoscopeLog","moonJournal","angelNumbers","soulQA"].forEach(k=>(ds[k]||[]).forEach(x=>{
    if(has(st[k],x.id)) return;
    if(k==="draws" && x.mode==="daily" && st.draws.some(y=>y.tool===x.tool&&y.mode==="daily"&&y.date===x.date)) return;
    if(k==="gratitude" && st.gratitude.some(y=>y.date===x.date)) return;
    st[k].push(x); }));
  return n; };
